[project]
name = "security-questionnaire-responder"
version = "0.1.0"
description = "LangGraph agent that auto-answers vendor security questionnaires (CAIQ, SIG, custom Excel) using a SOC 2 evidence corpus and a knowledge base, with confidence scores + citations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "b2b-agent-toolkit",
    "langgraph>=0.2.40",
    "anthropic>=0.39",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[project.scripts]
sqr = "sqr.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqr"]

[tool.uv.sources]
b2b-agent-toolkit = { path = "../b2b-agent-toolkit", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
